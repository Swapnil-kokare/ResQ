services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resq-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:80,*
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resq-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
